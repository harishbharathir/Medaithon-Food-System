<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participant ID Badges & Barcodes | Medaithon</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JsBarcode -->
  <script src="/vendor/jsbarcode/JsBarcode.all.min.js"></script>
  <!-- Lucide Icons -->
  <script src="/vendor/lucide/lucide.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <style>
    @media print {
      header, .no-print {
        display: none !important;
      }
      body {
        background: white !important;
        color: black !important;
        padding: 0 !important;
      }
      .badge-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12mm !important;
      }
      .id-card {
        background: white !important;
        border: 2px solid #000 !important;
        color: black !important;
        box-shadow: none !important;
        page-break-inside: avoid !important;
      }
      .id-card * {
        color: black !important;
      }
      .id-barcode {
        filter: none !important;
      }
    }
  </style>
</head>
<body class="p-4 md:p-8 pb-20">

  <!-- Header Controls -->
  <header class="max-w-6xl mx-auto mb-6 no-print">
    <div class="glass-panel p-4 md:px-6 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img src="/assets/medai-removebg-preview.png" alt="Logo" class="h-10 w-auto object-contain" onerror="this.src='/assets/logo.png'">
        <div>
          <h1 class="text-xl font-bold text-white flex items-center gap-2">
            Participant ID & Barcode Generator
          </h1>
          <p class="text-xs text-slate-400">Scan barcodes directly off screen or print badges for participants</p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="window.print()" class="btn-primary text-xs py-2 px-3.5 shadow">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i>
          Print Badges
        </button>
        <a href="/scanner.html" class="btn-secondary text-xs py-2 px-3">
          <i data-lucide="scan" class="w-3.5 h-3.5 text-indigo-400"></i>
          Test in Scanner
        </a>
        <a href="/dashboard.html" class="btn-secondary text-xs py-2 px-3">
          <i data-lucide="tv" class="w-3.5 h-3.5 text-cyan-400"></i>
          Live Dashboard
        </a>
      </div>
    </div>
  </header>

  <!-- Filter & Instructions Toolbar -->
  <div class="max-w-6xl mx-auto mb-6 no-print">
    <div class="glass-panel p-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-2 flex-1 max-w-md">
        <input type="text" id="badgeSearch" class="glass-input w-full text-xs" placeholder="Search participant name, team or ID...">
      </div>

      <div class="flex items-center gap-2 text-xs">
        <span class="text-slate-400">Filter:</span>
        <button onclick="filterBadges('all')" class="badge-filter px-3 py-1 rounded-lg bg-indigo-600 text-white font-medium" data-filter="all">All</button>
        <button onclick="filterBadges('Veg')" class="badge-filter px-3 py-1 rounded-lg bg-slate-800 text-slate-300 font-medium hover:bg-slate-700" data-filter="Veg">Veg</button>
        <button onclick="filterBadges('Non-Veg')" class="badge-filter px-3 py-1 rounded-lg bg-slate-800 text-slate-300 font-medium hover:bg-slate-700" data-filter="Non-Veg">Non-Veg</button>
      </div>
    </div>
  </div>

  <!-- Badges Grid Container -->
  <main class="max-w-6xl mx-auto">
    <div id="badgesContainer" class="badge-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Generated Cards go here -->
      <p class="text-xs text-slate-400 text-center col-span-full py-12">Loading barcodes...</p>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/badges.js"></script>
</body>
</html>
